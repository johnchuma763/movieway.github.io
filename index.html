<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MOVIEWAY</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #080b0f;
    color: white;
}

header {
    background: #0d1117;
    padding: 18px;
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid #202630;
}

.logo {
    color: #20d96b;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 15px;
}

.search-box {
    display: flex;
    gap: 8px;
}

.search-box input {
    flex: 1;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: #1a2029;
    color: white;
    outline: none;
    font-size: 15px;
}

.search-box button {
    background: #1769e0;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding: 15px;
    background: #0d1117;
}

nav button {
    white-space: nowrap;
    background: #171d26;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 17px;
}

nav button.active {
    background: #20d96b;
    color: #061008;
    font-weight: bold;
}

.hero {
    margin: 15px;
    padding: 25px;
    border-radius: 15px;
    background: linear-gradient(135deg, #102d20, #111827);
    border: 1px solid #1d3b2b;
}

.hero h1 {
    color: #20d96b;
    font-size: 30px;
    margin-bottom: 10px;
}

.hero p {
    color: #b9c0c9;
    line-height: 1.5;
}

.hero button {
    margin-top: 18px;
    padding: 12px 20px;
    background: #e21d2d;
    border: none;
    border-radius: 8px;
    color: white;
    font-weight: bold;
}

.section-title {
    padding: 10px 15px;
    font-size: 22px;
}

.movies {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 15px;
}

.movie {
    background: #11161e;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #202630;
}

.poster {
    height: 190px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #18232d, #263746);
    font-size: 48px;
}

.movie-info {
    padding: 12px;
}

.movie h3 {
    font-size: 17px;
    margin-bottom: 7px;
}

.movie p {
    color: #9da6b1;
    font-size: 13px;
    margin-bottom: 10px;
}

.rating {
    color: #ffd43b;
}

.watch {
    width: 100%;
    padding: 9px;
    border: none;
    border-radius: 7px;
    background: #e21d2d;
    color: white;
    font-weight: bold;
}

footer {
    text-align: center;
    padding: 30px 15px;
    margin-top: 20px;
    color: #737c87;
    border-top: 1px solid #202630;
}

@media (min-width: 700px) {
    .movies {
        grid-template-columns: repeat(4, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">▶ MOVIEWAY</div>

    <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search movies..."
            onkeyup="searchMovies()"
        >
        <button onclick="searchMovies()">SEARCH</button>
    </div>
</header>

<nav>
    <button class="active">Home</button>
    <button>Trending</button>
    <button>Movies</button>
    <button>TV Shows</button>
    <button>Football</button>
    <button>Anime</button>
    <button>K-Drama</button>
</nav>

<section class="hero">
    <h1>Welcome to MOVIEWAY</h1>
    <p>
